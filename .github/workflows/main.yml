name: Build NightCore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NightCore
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # NightCore 2.16.4 depends on ExcellentCrates 6.4.1,
      # but that artifact is currently unavailable from its Maven repositories.
      - name: Checkout ExcellentCrates 6.4.1
        uses: actions/checkout@v4
        with:
          repository: nulli0n/ExcellentCrates-spigot
          ref: 30b4ffe02e178ac0f46375bc5bdcc3087ce9dc9f
          path: .deps/ExcellentCrates

      - name: Install ExcellentCrates 6.4.1
        run: |
          mvn -f .deps/ExcellentCrates/pom.xml \
            -U \
            -DskipTests \
            install

      - name: Build NightCore
        run: |
          mvn -U clean package -DskipTests

      - name: List build artifacts
        run: |
          find target -maxdepth 2 -type f -name "*.jar" -print

      - name: Upload NightCore
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-bs-fix
          path: target/*.jar
          if-no-files-found: error
