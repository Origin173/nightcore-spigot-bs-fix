name: Build NightCore

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - fix/**
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -U clean package -DskipTests

      - name: Show artifacts
        run: find target -maxdepth 2 -type f -name "*.jar" -print

      - name: Upload NightCore jar
        uses: actions/upload-artifact@v4
        with:
          name: nightcore-build
          path: target/*.jar
          if-no-files-found: error
